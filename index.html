<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consulta FIPE</title>
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <h1>Selecione o tipo de veiculo</h1>
        <div class="tab">
            <button class="tabLinks" onclick="openCity(event, 'cars')">Carros</button>
            <button class="tabLinks" onclick="openCity(event, 'trucks')">Caminhões</button>
            <button class="tabLinks" onclick="openCity(event, 'bikes')">Motos</button>
        </div>

        <div id="cars" class="tabContent">
            <label for="vehicleBrand">Marca do veiculo:</label> <br>
            <select name="vehicleBrand" id="vehicleBrand" onfocus='this.size=5;' onblur='this.size=1;' onchange='this.size=1;'>
                <option value="Ford">Ford</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Renault">Renault</option>
                <option value="Peugeot">Peugeot</option>
                <option value="Fiat">Fiat</option>
                <option value="Hyundai">Hyundai</option>
                <option value="BMW">BMW</option>
                <option value="Porsche">Porsche</option>
                <option value="Ferrari">Ferrari</option>
                <option value="Honda">Honda</option>
                <option value="Toyota">Toyota</option>
                <option value="Subaru">Subaru</option>
                <option value="Nissan">Nissan</option>
                <option value="Chevrolet">Chevrolet</option>
            </select>
            <br>
            <button class="btnSearch">Consultar</button>
        </div>

        <div id="trucks" class="tabContent">
            <h3>Caminhões</h3>
            <p>Aqui é a consulta dos caminhões</p>
            <button class="btnSearch">Consultar</button>
        </div>

        <div id="bikes" class="tabContent">
            <h3>Motos</h3>
            <p>Aqui é a consulta das motos</p>
            <button class="btnSearch">Consultar</button>
        </div>
    </div>

    <script src="script/tabHelper.js"></script>
    <script src="script/script.js"></script>
</body>
</html>
